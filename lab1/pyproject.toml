[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   
    "F",   
    "I",   
    "B",   
    "UP",  
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["task1", "task2"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
pythonPlatform = "Windows"