default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: full-check
        name: Full static check
        entry: make check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tests
        name: Tests
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]